# Monta os instaladores do Painel do dia (Windows e Mac) e publica a versão com o arquivo de atualização (latest.json).
# Roda quando sai uma etiqueta "v*" (ex.: v0.1.1). Os programas já instalados acham a versão nova sozinhos.
name: Publicar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows-latest
            argumentos: ''
          - sistema: macos-latest
            argumentos: '--target universal-apple-darwin'
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sistema == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # O empacotador baixa as ferramentas do instalador do Windows (NSIS) na hora e, quando o GitHub responde 504, a
      # montagem inteira falha (aconteceu em 08/11/2026). Aqui elas são baixadas antes, com até 6 tentativas, na pasta
      # onde o empacotador procura; se já estiverem lá, ele não baixa de novo.
      - name: Ferramentas do instalador do Windows (com novas tentativas)
        if: matrix.sistema == 'windows-latest'
        shell: pwsh
        run: |
          $base = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          function Baixar($url, $destino) {
            for ($i = 1; $i -le 6; $i++) {
              try { Invoke-WebRequest -Uri $url -OutFile $destino -UseBasicParsing; return }
              catch { Write-Host "Tentativa $i falhou: $url"; Start-Sleep -Seconds (15 * $i) }
            }
            throw "Não deu para baixar $url"
          }
          $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
          Baixar 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' $zip
          Expand-Archive -Path $zip -DestinationPath $base -Force
          if (Test-Path (Join-Path $base 'nsis-3.13')) { Rename-Item (Join-Path $base 'nsis-3.13') 'NSIS' }
          $plugins = Join-Path $base 'NSIS\Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Baixar 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' (Join-Path $plugins 'nsis_tauri_utils.dll')

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura das atualizações (não é a assinatura paga da Microsoft/Apple): o programa só aceita versão nossa
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Painel do dia ${{ github.ref_name }}'
          releaseBody: 'Baixe o instalador: Windows (.exe) ou Mac (.dmg). Quem já tem o Painel do dia instalado recebe esta versão sozinho.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.argumentos }}
