<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Painel do dia · Central da Educação</title>
    <style>
      /* Mesmas cores da Central (src/estilos/tokens.css, tema claro e escuro) */
      :root {
        --fundo: #f5f7f5;
        --texto: #13241a;
        --texto-2: #4b5a51;
        --alerta: #8f5200;
        --borda: #c5cfc8;
        --fonte: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #111214;
          --texto: #e9eaec;
          --texto-2: #b3b7bc;
          --alerta: #e8a64a;
          --borda: #3b3e42;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      /* A janela do programa é transparente: a tela de abertura é um cartão de cantos arredondados */
      html { background: transparent; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        border: 1px solid var(--borda);
        border-radius: 16px;
        background: var(--fundo);
        color: var(--texto);
        font-family: var(--fonte);
        text-align: center;
      }
      main { display: grid; justify-items: center; gap: 16px; max-width: 300px; }
      img { width: 220px; height: auto; }
      .escura { display: none; }
      @media (prefers-color-scheme: dark) { .clara { display: none; } .escura { display: block; } }
      h1 { font-size: 20px; font-weight: 700; }
      p { color: var(--texto-2); font-size: 14px; line-height: 1.5; }
      p.alerta { color: var(--alerta); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img class="clara" src="logo.png" alt="Secretaria Municipal de Educação de Vila Rica" />
      <img class="escura" src="logo-escuro.png" alt="Secretaria Municipal de Educação de Vila Rica" />
      <h1>Painel do dia</h1>
      <p id="situacao" role="status">Abrindo a Central da Educação…</p>
    </main>
    <script>
      // Confere se a Central responde antes de abrir o painel: sem internet, a pessoa vê este aviso (e não a página
      // de erro do sistema), e o programa tenta de novo sozinho.
      // Tamanho escolhido no menu do ícone (pequeno, médio ou grande); o programa manda pelo endereço desta tela
      const parametros = new URLSearchParams(location.search);
      const pedido = parametros.get('tamanho');
      const tamanho = ['pequeno', 'medio', 'grande'].includes(pedido) ? pedido : 'medio';
      // Versão, sistema e identificador do programa seguem para o painel, que avisa a Central (o suporte vê quem está
      // desatualizado); só passa o que estiver no formato certo
      const painel = new URL('https://central-da-educacao.vercel.app/painel?app=1');
      painel.searchParams.set('tamanho', tamanho);
      const versao = parametros.get('versao') || '';
      const sistema = parametros.get('sistema') || '';
      const aparelho = parametros.get('aparelho') || '';
      if (/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(versao) && /^(windows|mac)$/.test(sistema) && /^[0-9a-f]{32}$/.test(aparelho)) {
        painel.searchParams.set('versao', versao);
        painel.searchParams.set('sistema', sistema);
        painel.searchParams.set('aparelho', aparelho);
      }
      const PAINEL = painel.toString();
      const situacao = document.getElementById('situacao');
      async function tentar() {
        try {
          await fetch('https://central-da-educacao.vercel.app/entrar', { mode: 'no-cors', cache: 'no-store' });
          location.replace(PAINEL);
        } catch {
          situacao.className = 'alerta';
          situacao.textContent = 'Sem conexão com a internet. O painel abre sozinho assim que ela voltar.';
          setTimeout(tentar, 10000);
        }
      }
      tentar();
    </script>
  </body>
</html>
